<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coupons & Promo Codes - Admin Console</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar"></aside>

  <div class="main-content">
    <div class="admin-topbar">
      <div class="topbar-title" id="pageTitle">কুপন ও ডিসকাউন্ট</div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-primary btn-sm" onclick="openCouponModal()">
          <span id="iconPlusCoupon"></span> <span id="lblAddCoupon">নতুন কুপন যোগ</span>
        </button>
        <div class="admin-avatar">A</div>
      </div>
    </div>

    <div class="page-content">
      <div class="table-card">
        <div class="table-card-header">
          <div class="table-card-title" id="lblTableTitle">কুপন ও প্রমো কোড তালিকা</div>
          <button type="button" class="btn btn-outline btn-sm" onclick="loadCoupons()" id="btnRefresh">রিফ্রেশ</button>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th id="thCode">কুপন কোড</th>
                <th id="thType">ডিসকাউন্ট টাইপ</th>
                <th id="thVal">ভ্যালু / পরিমাণ</th>
                <th id="thMin">ন্যূনতম অর্ডার</th>
                <th id="thUsed">ব্যবহারের সংখ্যা</th>
                <th id="thStatus">স্ট্যাটাস</th>
                <th id="thAction">অ্যাকশন</th>
              </tr>
            </thead>
            <tbody id="couponsTable">
              <tr><td colspan="8" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Coupon Modal -->
<div class="modal-overlay" id="couponModal">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">
      <div class="modal-title" id="modalCouponTitle">নতুন কুপন কোড তৈরি করুন</div>
      <button type="button" class="modal-close" onclick="closeCouponModal()" id="iconCloseModal"></button>
    </div>
    <div class="modal-body">
      <form onsubmit="handleSaveCoupon(event)">
        <div class="form-group">
          <label class="form-label required" id="lblCodeInput">কুপন কোড (যেমন: EID2026)</label>
          <input type="text" class="form-control" id="cpCode" required style="text-transform:uppercase; font-weight:700; letter-spacing:1px;" placeholder="LUNGI10">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label required" id="lblTypeInput">ডিসকাউন্টের ধরন</label>
            <select class="form-control" id="cpType">
              <option value="percentage">শতকরা হার (%)</option>
              <option value="fixed">স্থির টাকা (৳ Fixed)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label required" id="lblValInput">ডিসকাউন্ট ভ্যালু</label>
            <input type="number" class="form-control" id="cpValue" min="1" step="any" required placeholder="10">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" id="lblMinInput">ন্যূনতম অর্ডার (৳)</label>
            <input type="number" class="form-control" id="cpMin" min="0" placeholder="500">
          </div>
          <div class="form-group">
            <label class="form-label" id="lblMaxInput">সর্বোচ্চ ছাড় (ঐচ্ছিক ৳)</label>
            <input type="number" class="form-control" id="cpMax" min="0" placeholder="200">
          </div>
        </div>
        <div class="form-group">
          <label style="display:flex; align-items:center; gap:8px; font-size:13.5px; cursor:pointer;">
            <input type="checkbox" id="cpActive" checked>
            <span id="lblActiveCheck">এখনই সক্রিয় রাখুন</span>
          </label>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">
          <button type="button" class="btn btn-outline" onclick="closeCouponModal()" id="btnCancel">বাতিল</button>
          <button type="submit" class="btn btn-primary" id="btnSaveCoupon">কুপন সংরক্ষণ করুন</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/icons.js"></script>
<script src="/js/i18n.js"></script>
<script src="/admin/admin.js"></script>
<script>
document.getElementById('iconPlusCoupon').innerHTML = svgIcon('plus', 15);
document.getElementById('iconCloseModal').innerHTML = svgIcon('x', 16);

let cachedCoupons = [];

function syncLabels() {
  const en = getLang() === 'en';
  renderAdminSidebar('coupons');
  document.getElementById('pageTitle').innerHTML = `${svgIcon('sparkles', 19)} ${en ? 'Coupons & Promo Codes' : 'কুপন ও ডিসকাউন্ট'}`;
  document.getElementById('lblAddCoupon').textContent = en ? 'Add Coupon' : 'নতুন কুপন যোগ';
  document.getElementById('lblTableTitle').textContent = en ? 'Active & Inactive Coupons' : 'কুপন ও প্রমো কোড তালিকা';
  document.getElementById('btnRefresh').textContent = en ? 'Refresh' : 'রিফ্রেশ';
  document.getElementById('thCode').textContent = en ? 'Coupon Code' : 'কুপন কোড';
  document.getElementById('thType').textContent = en ? 'Type' : 'ডিসকাউন্ট টাইপ';
  document.getElementById('thVal').textContent = en ? 'Value' : 'ভ্যালু / পরিমাণ';
  document.getElementById('thMin').textContent = en ? 'Min. Order' : 'ন্যূনতম অর্ডার';
  document.getElementById('thUsed').textContent = en ? 'Times Used' : 'ব্যবহারের সংখ্যা';
  document.getElementById('thStatus').textContent = en ? 'Status' : 'স্ট্যাটাস';
  document.getElementById('thAction').textContent = en ? 'Action' : 'অ্যাকশন';
  renderCouponsTable();
}

async function loadCoupons() {
  const admin = await checkSession();
  if (!admin) return;
  try {
    const res = await fetch('/admin/api/coupons').then(r => r.json());
    cachedCoupons = res.coupons || [];
    renderCouponsTable();
  } catch (err) {
    console.error('Failed loading coupons:', err);
  }
}

function renderCouponsTable() {
  const tbody = document.getElementById('couponsTable');
  const en = getLang() === 'en';
  if (!cachedCoupons.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty-state">${en ? 'No coupons created yet' : 'কোনো কুপন তৈরি করা হয়নি'}</td></tr>`;
    return;
  }

  tbody.innerHTML = cachedCoupons.map((c, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>
        <span style="font-family:monospace; font-weight:700; background:var(--primary-soft); color:var(--primary-dark); padding:3px 8px; border-radius:4px; font-size:13px; letter-spacing:0.5px;">
          ${escapeHtml(c.code)}
        </span>
      </td>
      <td>${c.discount_type === 'percentage' ? (en ? 'Percentage (%)' : 'শতকরা (%)') : (en ? 'Fixed Amount' : 'স্থির টাকা (৳)')}</td>
      <td style="font-weight:700; color:var(--primary);">
        ${c.discount_type === 'percentage' ? `${c.discount_value}%` : `৳${c.discount_value}`}
      </td>
      <td>${c.min_order_amount > 0 ? `৳${c.min_order_amount}` : (en ? 'No minimum' : 'সীমা নেই')}</td>
      <td style="font-weight:600;">${c.times_used || 0}</td>
      <td>
        <span class="status-badge ${c.is_active ? 'badge-active' : 'badge-inactive'}">
          ${c.is_active ? (en ? 'Active' : 'সক্রিয়') : (en ? 'Inactive' : 'নিষ্ক্রিয়')}
        </span>
      </td>
      <td>
        <div style="display:flex; gap:6px;">
          <button type="button" class="btn btn-outline btn-sm" onclick="toggleCoupon(${c.id})" style="padding:4px 8px; font-size:11.5px;">
            ${c.is_active ? (en ? 'Deactivate' : 'নিষ্ক্রিয় করুন') : (en ? 'Activate' : 'সক্রিয় করুন')}
          </button>
          <button type="button" class="btn btn-danger btn-sm" onclick="deleteCoupon(${c.id})" style="padding:4px 8px; font-size:11.5px;">
            ${en ? 'Delete' : 'মুছুন'}
          </button>
        </div>
      </td>
    </tr>
  `).join('');
}

function openCouponModal() {
  document.getElementById('cpCode').value = '';
  document.getElementById('cpValue').value = '';
  document.getElementById('cpMin').value = '500';
  document.getElementById('cpMax').value = '';
  document.getElementById('cpActive').checked = true;
  document.getElementById('couponModal').classList.add('open');
}

function closeCouponModal() {
  document.getElementById('couponModal').classList.remove('open');
}

async function handleSaveCoupon(e) {
  e.preventDefault();
  const btn = document.getElementById('btnSaveCoupon');
  btn.disabled = true;

  const payload = {
    code: document.getElementById('cpCode').value.trim(),
    discount_type: document.getElementById('cpType').value,
    discount_value: document.getElementById('cpValue').value,
    min_order_amount: document.getElementById('cpMin').value || 0,
    max_discount_amount: document.getElementById('cpMax').value || null,
    is_active: document.getElementById('cpActive').checked
  };

  try {
    const res = await fetch('/admin/api/coupons', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(r => r.json());

    btn.disabled = false;
    if (res.success) {
      showToast(res.message, 'success');
      closeCouponModal();
      loadCoupons();
    } else {
      showToast(res.message || 'Error', 'error');
    }
  } catch {
    btn.disabled = false;
    showToast('Network error', 'error');
  }
}

async function toggleCoupon(id) {
  try {
    const res = await fetch(`/admin/api/coupons/${id}/toggle`, { method: 'PUT' }).then(r => r.json());
    if (res.success) {
      showToast(res.message, 'success');
      loadCoupons();
    }
  } catch {}
}

async function deleteCoupon(id) {
  const en = getLang() === 'en';
  if (!confirm(en ? 'Delete this coupon code?' : 'এই কুপনটি মুছে ফেলতে চান?')) return;
  try {
    const res = await fetch(`/admin/api/coupons/${id}`, { method: 'DELETE' }).then(r => r.json());
    if (res.success) {
      showToast(res.message, 'success');
      loadCoupons();
    }
  } catch {}
}

window.onLanguageChange = syncLabels;
syncLabels();
loadCoupons();
</script>
</body>
</html>
