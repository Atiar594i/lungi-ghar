<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In - Lungi Ghar</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    body {
      background: linear-gradient(135deg, #0d2b22 0%, #0f4c3a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
    }
    .login-logo { text-align: center; margin-bottom: 28px; }
    .login-mark {
      width: 48px; height: 48px; border-radius: 12px;
      background: var(--primary); color: white;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
    }
    .login-logo h1 { font-size: 22px; font-weight: 700; color: var(--dark); }
    .login-logo p { color: var(--text-light); font-size: 13.5px; margin-top: 4px; }
    .error-msg {
      background: #fef2f2; color: #991b1b; border: 1px solid #fecaca;
      padding: 11px 14px; border-radius: 8px; font-size: 13.5px; margin-bottom: 16px; display: none;
    }
  </style>
</head>
<body>
<div class="login-box">
  <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
    <div data-lang-switcher></div>
  </div>
  <div class="login-logo">
    <div class="login-mark" id="loginMark"></div>
    <h1 id="loginTitle">অ্যাডমিন কনসোল</h1>
    <p id="loginSub">স্টোর ম্যানেজমেন্টে সাইন ইন করুন</p>
  </div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="form-group">
    <label class="form-label" id="lblUser">ইউজারনেম</label>
    <input class="form-control" id="username" type="text" placeholder="admin" autocomplete="username">
  </div>
  <div class="form-group">
    <label class="form-label" id="lblPass">পাসওয়ার্ড</label>
    <input class="form-control" id="password" type="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button type="button" class="btn btn-primary" style="width:100%; padding:12px;" id="loginBtn" onclick="doLogin()">সাইন ইন করুন</button>
  <p style="text-align:center; margin-top:18px; font-size:12.5px; color:var(--text-light);">
    Default: admin / admin123
  </p>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/icons.js"></script>
<script src="/js/i18n.js"></script>
<script src="/admin/admin.js"></script>
<script>
document.getElementById('loginMark').innerHTML = svgIcon('lock', 22);
document.getElementById('password').addEventListener('keypress', e => {
  if (e.key === 'Enter') doLogin();
});

function syncLoginLang() {
  const en = getLang() === 'en';
  document.getElementById('loginTitle').textContent = en ? 'Admin Console' : 'অ্যাডমিন কনসোল';
  document.getElementById('loginSub').textContent = en ? 'Sign in to manage orders, products & users' : 'স্টোর, অর্ডার ও ইউজার পরিচালনার জন্য সাইন ইন করুন';
  document.getElementById('lblUser').textContent = en ? 'Username' : 'ইউজারনেম';
  document.getElementById('lblPass').textContent = en ? 'Password' : 'পাসওয়ার্ড';
  document.getElementById('loginBtn').textContent = en ? 'Sign In' : 'সাইন ইন করুন';
}
window.onLanguageChange = syncLoginLang;
syncLoginLang();

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('errorMsg');

  if (!username || !password) {
    errEl.textContent = getLang() === 'en' ? 'Enter username and password' : 'ইউজারনেম ও পাসওয়ার্ড দিন';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  errEl.style.display = 'none';

  const data = await fetch('/admin/login-action', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  }).then(r => r.json());

  if (data.success) {
    showToast(getLang() === 'en' ? 'Signed in' : 'লগইন সফল হয়েছে', 'success');
    setTimeout(() => { window.location.href = '/admin/dashboard'; }, 600);
  } else {
    errEl.textContent = data.message || 'Login failed';
    errEl.style.display = 'block';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
