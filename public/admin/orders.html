<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Admin Console</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar"></aside>

  <div class="main-content">
    <div class="admin-topbar">
      <div class="topbar-title" id="pageTitle">অর্ডার ব্যবস্থাপনা</div>
      <div class="topbar-actions">
        <div class="admin-avatar">A</div>
      </div>
    </div>

    <div class="page-content">
      <div class="table-card" style="margin-bottom:20px;">
        <div style="padding:15px 20px;">
          <div class="filter-bar">
            <select class="form-control" id="statusFilter" onchange="loadOrders(1)" style="width:170px;">
              <option value="all">সব অর্ডার / All</option>
              <option value="pending">অপেক্ষামান / Pending</option>
              <option value="confirmed">নিশ্চিত / Confirmed</option>
              <option value="processing">প্রক্রিয়াধীন / Processing</option>
              <option value="shipped">পাঠানো হয়েছে / Shipped</option>
              <option value="delivered">ডেলিভারি সম্পন্ন / Delivered</option>
              <option value="cancelled">বাতিল / Cancelled</option>
            </select>
            <div class="search-box">
              <span id="iconSearch"></span>
              <input type="text" id="searchOrder" placeholder="অর্ডার, নাম বা ফোন..." onkeypress="if(event.key==='Enter')loadOrders(1)">
            </div>
            <button type="button" class="btn btn-primary btn-sm" onclick="loadOrders(1)" id="btnSearch">খুঁজুন</button>
            <span id="totalCount" style="color:var(--text-light); font-size:13.5px; margin-left:auto;"></span>
          </div>
        </div>
      </div>

      <div class="table-card">
        <div class="table-card-header">
          <div class="table-card-title" id="hdrOrdList">অর্ডারের তালিকা</div>
          <div style="display:flex; gap:8px;">
            <a href="/admin/api/orders/export/csv" class="btn btn-outline btn-sm" id="btnExportCsv">CSV এক্সপোর্ট</a>
            <button type="button" class="btn btn-outline btn-sm" onclick="loadOrders(1)" id="btnRefresh">রিফ্রেশ</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th id="th1">অর্ডার নম্বর</th>
                <th id="th2">গ্রাহক</th>
                <th id="th3">পেমেন্ট</th>
                <th id="th4">মোট</th>
                <th id="th5">অর্ডার স্ট্যাটাস</th>
                <th id="th6">পেমেন্ট স্ট্যাটাস</th>
                <th id="th7">তারিখ</th>
                <th id="th8">অ্যাকশন</th>
              </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
          </table>
        </div>
        <div id="ordersPagination" style="display:flex; gap:8px; padding:15px; justify-content:center;"></div>
      </div>
    </div>
  </div>
</div>

<!-- Order Detail Modal -->
<div class="modal-overlay" id="orderModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">অর্ডারের বিবরণ</div>
      <button type="button" class="modal-close" onclick="closeModal()" id="iconClose"></button>
    </div>
    <div class="modal-body" id="orderModalBody">Loading...</div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" onclick="printInvoice()" id="btnPrint">ইনভয়েস প্রিন্ট</button>
      <button type="button" class="btn btn-outline" onclick="closeModal()" id="btnClose">বন্ধ করুন</button>
      <button type="button" class="btn btn-primary" onclick="saveOrderStatus()" id="btnSave">সংরক্ষণ করুন</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/icons.js"></script>
<script src="/js/i18n.js"></script>
<script src="/admin/admin.js"></script>
<script>
document.getElementById('iconSearch').innerHTML = svgIcon('search', 15);
document.getElementById('iconClose').innerHTML = svgIcon('x', 16);

let currentOrderId = null;
let currentOrderObj = null;
let lastOrdersData = null;

function syncLabels() {
  const en = getLang() === 'en';
  renderAdminSidebar('orders');
  document.getElementById('pageTitle').innerHTML = `${svgIcon('package', 19)} ${en ? 'Orders Management' : 'অর্ডার ব্যবস্থাপনা'}`;
  document.getElementById('hdrOrdList').textContent = en ? 'Order Queue' : 'অর্ডারের তালিকা';
  document.getElementById('btnSearch').textContent = en ? 'Filter' : 'খুঁজুন';
  document.getElementById('btnRefresh').innerHTML = `${svgIcon('refresh', 14)} ${en ? 'Refresh' : 'রিফ্রেশ'}`;
  document.getElementById('searchOrder').placeholder = en ? 'Order #, name or phone...' : 'অর্ডার, নাম বা ফোন...';
  document.getElementById('modalTitle').textContent = en ? 'Order Details' : 'অর্ডারের বিবরণ';
  document.getElementById('btnPrint').innerHTML = `${svgIcon('printer', 15)} ${en ? 'Print Invoice' : 'ইনভয়েস প্রিন্ট'}`;
  document.getElementById('btnClose').textContent = en ? 'Close' : 'বন্ধ করুন';
  document.getElementById('btnSave').textContent = en ? 'Save Status' : 'সংরক্ষণ করুন';
}

async function loadOrders(page = 1) {
  const status = document.getElementById('statusFilter').value;
  const search = document.getElementById('searchOrder').value.trim();
  const url = `/admin/api/orders?status=${encodeURIComponent(status)}&search=${encodeURIComponent(search)}&page=${page}&limit=20`;
  document.getElementById('ordersTable').innerHTML = '<tr><td colspan="9" class="empty-state">Loading...</td></tr>';

  const data = await fetch(url).then(r => r.json());
  lastOrdersData = { ...data, page };
  renderOrdersTable();
}

function renderOrdersTable() {
  if (!lastOrdersData) return;
  const en = getLang() === 'en';
  const data = lastOrdersData;
  const stLabels = getStatusLabels();
  const payLabels = getPaymentStatusLabels();

  document.getElementById('totalCount').textContent = en ? `Total ${data.total || 0} orders` : `মোট ${data.total || 0} টি অর্ডার`;

  const tbody = document.getElementById('ordersTable');
  if (!data.orders || data.orders.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9" class="empty-state">${en ? 'No orders found' : 'কোনো অর্ডার নেই'}</td></tr>`;
    document.getElementById('ordersPagination').innerHTML = '';
    return;
  }

  tbody.innerHTML = data.orders.map((o, i) => `
    <tr>
      <td style="color:var(--text-light);">${(data.page - 1) * 20 + i + 1}</td>
      <td><strong style="color:var(--primary);">${escapeHtml(o.order_number)}</strong></td>
      <td>
        <div style="font-weight:600;">${escapeHtml(o.customer_name)}</div>
        <div style="font-size:12px;color:var(--text-light);">${escapeHtml(o.customer_phone)}</div>
        <div style="font-size:11.5px;color:var(--text-light);">${escapeHtml(o.district)}</div>
      </td>
      <td>
        <div style="font-weight:600;">${o.payment_method === 'bkash' ? 'bKash' : 'COD'}</div>
        ${o.bkash_transaction_id ? `<div style="font-size:11px;color:var(--text-light);">Trx: ${escapeHtml(o.bkash_transaction_id)}</div>` : ''}
      </td>
      <td style="font-weight:700; color:var(--primary);">${formatPrice(o.total)}</td>
      <td><span class="status-badge ${statusClasses[o.order_status] || 'badge-pending'}">${stLabels[o.order_status] || o.order_status}</span></td>
      <td><span class="status-badge ${o.payment_status === 'paid' ? 'badge-paid' : o.payment_status === 'failed' ? 'badge-failed' : 'badge-unpaid'}">${payLabels[o.payment_status] || o.payment_status}</span></td>
      <td style="font-size:12px;color:var(--text-light);">${formatDate(o.created_at)}</td>
      <td><button type="button" class="btn btn-primary btn-xs" onclick="viewOrder(${o.id})">${en ? 'Manage' : 'বিস্তারিত'}</button></td>
    </tr>
  `).join('');

  const totalPages = Math.ceil((data.total || 0) / 20);
  const paginationEl = document.getElementById('ordersPagination');
  paginationEl.innerHTML = '';
  if (totalPages > 1) {
    for (let i = 1; i <= totalPages; i++) {
      const btn = document.createElement('button');
      btn.className = `btn btn-sm ${i === data.page ? 'btn-primary' : 'btn-outline'}`;
      btn.textContent = i;
      btn.onclick = () => loadOrders(i);
      paginationEl.appendChild(btn);
    }
  }
}

async function viewOrder(orderId) {
  currentOrderId = orderId;
  const en = getLang() === 'en';
  document.getElementById('orderModal').classList.add('open');
  document.getElementById('orderModalBody').innerHTML = '<div style="text-align:center;padding:30px;">Loading...</div>';

  const data = await fetch(`/admin/api/orders/${orderId}`).then(r => r.json());
  if (!data.success || !data.order) return;

  const order = data.order;
  currentOrderObj = order;
  const items = Array.isArray(order.items) ? order.items : [];

  document.getElementById('orderModalBody').innerHTML = `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px; background:var(--bg); padding:16px; border-radius:10px;">
      <div><strong>${en ? 'Order Number' : 'অর্ডার নম্বর'}:</strong><br>${escapeHtml(order.order_number)}</div>
      <div><strong>${en ? 'Date' : 'তারিখ'}:</strong><br>${formatDate(order.created_at)}</div>
      <div><strong>${en ? 'Customer' : 'গ্রাহক'}:</strong><br>${escapeHtml(order.customer_name)}<br><small>${escapeHtml(order.customer_phone)}</small></div>
      <div><strong>${en ? 'Address' : 'ঠিকানা'}:</strong><br>${escapeHtml(order.district)}${order.thana ? ', ' + escapeHtml(order.thana) : ''}<br><small>${escapeHtml(order.shipping_address)}</small></div>
      <div><strong>${en ? 'Payment' : 'পেমেন্ট'}:</strong><br>${order.payment_method === 'bkash' ? 'bKash Auto' : 'Cash on Delivery'}
        ${order.bkash_transaction_id ? `<br><small style="color:var(--primary);">TrxID: ${escapeHtml(order.bkash_transaction_id)}</small>` : ''}
        ${order.bkash_payment_id ? `<br><small style="color:var(--text-light);">PayID: ${escapeHtml(order.bkash_payment_id)}</small>` : ''}
      </div>
      <div><strong>${en ? 'Total' : 'মোট বিল'}:</strong><br><span style="font-size:18px;font-weight:700;color:var(--primary);">${formatPrice(order.total)}</span>
        <br><small style="color:var(--text-light);">${formatPrice(order.subtotal)} + ${formatPrice(order.shipping_cost)}${order.discount ? ` - ${formatPrice(order.discount)} (${order.coupon_code || 'Promo'})` : ''}</small>
      </div>
    </div>

    <div style="margin-bottom:20px;">
      <strong>${en ? 'Items' : 'পণ্যের তালিকা'}:</strong>
      <div style="margin-top:10px;">
        ${items.map(item => `
          <div style="display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--border);">
            <img src="${escapeHtml(item.image || '/img/no-image.svg')}" style="width:45px;height:45px;border-radius:6px;object-fit:cover;background:#f4f3ef;" onerror="this.src='/img/no-image.svg'">
            <div style="flex:1;">
              <div style="font-weight:600;font-size:13.5px;">${escapeHtml(en && item.name_en ? item.name_en : item.name)}</div>
              <div style="font-size:12px;color:var(--text-light);">${escapeHtml(translateAttr(item.color || ''))} ${escapeHtml(translateAttr(item.size || ''))} · ×${item.quantity}</div>
            </div>
            <div style="font-weight:600;">${formatPrice(item.price * item.quantity)}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">${en ? 'Order Status' : 'অর্ডার স্ট্যাটাস'}</label>
        <select class="form-control" id="newOrderStatus">
          <option value="pending" ${order.order_status === 'pending' ? 'selected' : ''}>${t('status_pending')}</option>
          <option value="confirmed" ${order.order_status === 'confirmed' ? 'selected' : ''}>${t('status_confirmed')}</option>
          <option value="processing" ${order.order_status === 'processing' ? 'selected' : ''}>${t('status_processing')}</option>
          <option value="shipped" ${order.order_status === 'shipped' ? 'selected' : ''}>${t('status_shipped')}</option>
          <option value="delivered" ${order.order_status === 'delivered' ? 'selected' : ''}>${t('status_delivered')}</option>
          <option value="cancelled" ${order.order_status === 'cancelled' ? 'selected' : ''}>${t('status_cancelled')}</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">${en ? 'Payment Status' : 'পেমেন্ট স্ট্যাটাস'}</label>
        <select class="form-control" id="newPaymentStatus">
          <option value="pending" ${order.payment_status === 'pending' ? 'selected' : ''}>${t('pay_pending')}</option>
          <option value="paid" ${order.payment_status === 'paid' ? 'selected' : ''}>${t('pay_paid')}</option>
          <option value="failed" ${order.payment_status === 'failed' ? 'selected' : ''}>${t('pay_failed')}</option>
        </select>
      </div>
    </div>
    ${order.notes ? `<div class="alert alert-info">Note: ${escapeHtml(order.notes)}</div>` : ''}
  `;
}

function printInvoice() {
  if (!currentOrderObj) return;
  const o = currentOrderObj;
  const w = window.open('', '_blank', 'width=800,height=700');
  const itemsHtml = (o.items || []).map(i => `
    <tr>
      <td style="padding:8px;border-bottom:1px solid #ddd;">${escapeHtml(i.name)} (${escapeHtml(i.color || '')} ${escapeHtml(i.size || '')})</td>
      <td style="padding:8px;border-bottom:1px solid #ddd;text-align:center;">${i.quantity}</td>
      <td style="padding:8px;border-bottom:1px solid #ddd;text-align:right;">৳${i.price}</td>
      <td style="padding:8px;border-bottom:1px solid #ddd;text-align:right;">৳${i.price * i.quantity}</td>
    </tr>
  `).join('');

  w.document.write(`
    <!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><title>Invoice - ${escapeHtml(o.order_number)}</title>
    <style>body{font-family:sans-serif;padding:30px;color:#1e293b;}table{width:100%;border-collapse:collapse;margin-top:20px;}</style></head>
    <body>
      <h2>Lungi Ghar — Order Invoice</h2>
      <p><strong>Order:</strong> ${escapeHtml(o.order_number)} | <strong>Date:</strong> ${formatDate(o.created_at)}</p>
      <hr>
      <p><strong>Customer:</strong> ${escapeHtml(o.customer_name)} (${escapeHtml(o.customer_phone)})</p>
      <p><strong>Address:</strong> ${escapeHtml(o.district)}, ${escapeHtml(o.thana || '')} ${escapeHtml(o.shipping_address)}</p>
      <p><strong>Payment:</strong> ${o.payment_method === 'bkash' ? 'bKash' : 'Cash on Delivery'} (${o.payment_status})${o.bkash_transaction_id ? ' - TrxID: ' + escapeHtml(o.bkash_transaction_id) : ''}</p>
      <table>
        <thead><tr style="background:#f1f5f9;"><th style="padding:8px;text-align:left;">Item</th><th style="padding:8px;">Qty</th><th style="padding:8px;text-align:right;">Price</th><th style="padding:8px;text-align:right;">Total</th></tr></thead>
        <tbody>${itemsHtml}</tbody>
      </table>
      <div style="text-align:right;margin-top:20px;">
        <p>Subtotal: ৳${o.subtotal}</p>
        <p>Delivery: ৳${o.shipping_cost}</p>
        <h3>Total: ৳${o.total}</h3>
      </div>
      <script>window.print();<\/script>
    </body></html>
  `);
  w.document.close();
}

async function saveOrderStatus() {
  if (!currentOrderId) return;
  const order_status = document.getElementById('newOrderStatus').value;
  const payment_status = document.getElementById('newPaymentStatus').value;
  const data = await fetch(`/admin/api/orders/${currentOrderId}/status`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ order_status, payment_status })
  }).then(r => r.json());

  if (data.success) {
    showToast(data.message, 'success');
    closeModal();
    loadOrders(lastOrdersData?.page || 1);
  } else {
    showToast(data.message || 'Error', 'error');
  }
}

function closeModal() {
  document.getElementById('orderModal').classList.remove('open');
  currentOrderId = null;
}

const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('status')) {
  document.getElementById('statusFilter').value = urlParams.get('status');
}

window.onLanguageChange = function () {
  syncLabels();
  renderOrdersTable();
};

syncLabels();
checkSession().then(a => { if (a) loadOrders(1); });
</script>
</body>
</html>
