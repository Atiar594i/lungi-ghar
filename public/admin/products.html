<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Admin Console</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar"></aside>

  <div class="main-content">
    <div class="admin-topbar">
      <div class="topbar-title" id="pageTitle">পণ্য ব্যবস্থাপনা</div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-primary btn-sm" onclick="openAddModal()" id="btnAddNew">নতুন পণ্য যোগ করুন</button>
        <div class="admin-avatar">A</div>
      </div>
    </div>

    <div class="page-content">
      <div class="table-card">
        <div class="table-card-header">
          <div class="table-card-title" id="hdrAllProds">সব পণ্য</div>
          <div class="filter-bar">
            <div class="search-box">
              <span id="iconSearch"></span>
              <input type="text" id="searchProduct" placeholder="পণ্য খুঁজুন..." oninput="filterProducts()">
            </div>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>ছবি / Photo</th>
                <th>নাম / Product</th>
                <th>ক্যাটাগরি</th>
                <th>দাম</th>
                <th>স্টক</th>
                <th>বিক্রি</th>
                <th>স্ট্যাটাস</th>
                <th>অ্যাকশন</th>
              </tr>
            </thead>
            <tbody id="productsTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Product Modal -->
<div class="modal-overlay" id="productModal">
  <div class="modal" style="max-width:720px;">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">নতুন পণ্য যোগ করুন</div>
      <button type="button" class="modal-close" onclick="closeProductModal()" id="iconClose"></button>
    </div>
    <div class="modal-body">
      <form id="productForm" enctype="multipart/form-data">
        <input type="hidden" id="editProductId">
        <input type="hidden" id="existingImages" value="[]">

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">পণ্যের নাম (বাংলা) *</label>
            <input class="form-control" id="pName" type="text" required>
          </div>
          <div class="form-group">
            <label class="form-label">Product Name (English)</label>
            <input class="form-control" id="pNameEn" type="text" placeholder="Optional English title">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">ক্যাটাগরি / Category</label>
            <select class="form-control" id="pCategory"></select>
          </div>
          <div class="form-group">
            <label class="form-label">স্টক পরিমাণ / Stock</label>
            <input class="form-control" id="pStock" type="number" min="0" value="0">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">বিবরণ (বাংলা)</label>
            <textarea class="form-control" id="pDescription" rows="2"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Description (English)</label>
            <textarea class="form-control" id="pDescriptionEn" rows="2"></textarea>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">মূল দাম (৳) *</label>
            <input class="form-control" id="pPrice" type="number" min="0" required>
          </div>
          <div class="form-group">
            <label class="form-label">বিক্রয় দাম (৳) / Sale Price</label>
            <input class="form-control" id="pSalePrice" type="number" placeholder="Optional">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">সাইজ (কমা দিয়ে আলাদা করুন)</label>
            <input class="form-control" id="pSizes" type="text" placeholder="ফ্রি সাইজ (৫.৫ হাত), এক্সট্রা লম্বা">
          </div>
          <div class="form-group">
            <label class="form-label">রঙ (কমা দিয়ে আলাদা করুন)</label>
            <input class="form-control" id="pColors" type="text" placeholder="সাদা, নীল, সবুজ">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group" style="display:flex; align-items:center; gap:10px; padding-top:8px;">
            <input type="checkbox" id="pFeatured" style="width:18px;height:18px;">
            <label for="pFeatured" style="cursor:pointer;">বেস্টসেলার হিসেবে দেখান / Bestseller</label>
          </div>
          <div class="form-group" style="display:flex; align-items:center; gap:10px; padding-top:8px;" id="activeRow">
            <input type="checkbox" id="pActive" checked style="width:18px;height:18px;">
            <label for="pActive" style="cursor:pointer;">সক্রিয় / Active</label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">পণ্যের ছবি (সর্বোচ্চ ৫টি)</label>
          <input type="file" class="form-control" id="pImages" accept="image/*" multiple onchange="previewImages()">
          <div id="existingImagesPreview" class="img-preview-grid"></div>
          <div id="newImagesPreview" class="img-preview-grid"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" onclick="closeProductModal()">বাতিল / Cancel</button>
      <button type="button" class="btn btn-primary" onclick="saveProduct()" id="saveBtn">সংরক্ষণ করুন</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/icons.js"></script>
<script src="/js/i18n.js"></script>
<script src="/admin/admin.js"></script>
<script>
document.getElementById('iconSearch').innerHTML = svgIcon('search', 15);
document.getElementById('iconClose').innerHTML = svgIcon('x', 16);

let allProducts = [];
let categories = [];

function syncLabels() {
  const en = getLang() === 'en';
  renderAdminSidebar('products');
  document.getElementById('pageTitle').innerHTML = `${svgIcon('bag', 19)} ${en ? 'Products Catalog' : 'পণ্য ব্যবস্থাপনা'}`;
  document.getElementById('btnAddNew').innerHTML = `${svgIcon('plus', 15)} ${en ? 'Add Product' : 'নতুন পণ্য যোগ করুন'}`;
  document.getElementById('hdrAllProds').textContent = en ? 'All Products' : 'সব পণ্য';
  document.getElementById('searchProduct').placeholder = en ? 'Search products...' : 'পণ্য খুঁজুন...';
}

async function loadProducts() {
  const data = await fetch('/admin/api/products').then(r => r.json());
  allProducts = data.products || [];
  renderProducts(allProducts);
}

async function loadCategories() {
  const data = await fetch('/admin/api/categories').then(r => r.json());
  categories = data.categories || [];
  const sel = document.getElementById('pCategory');
  sel.innerHTML = `<option value="">${getLang() === 'en' ? 'Select Category' : 'ক্যাটাগরি নির্বাচন করুন'}</option>`;
  categories.forEach(c => sel.innerHTML += `<option value="${c.id}">${escapeHtml(localizeField(c, 'name'))}</option>`);
}

function renderProducts(products) {
  const en = getLang() === 'en';
  const tbody = document.getElementById('productsTable');
  if (!products || products.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty-state">${en ? 'No products found' : 'কোনো পণ্য নেই'}</td></tr>`;
    return;
  }

  tbody.innerHTML = products.map(p => `
    <tr>
      <td><img class="product-thumb" src="${escapeHtml((p.images && p.images[0]) || '/img/no-image.svg')}" onerror="this.src='/img/no-image.svg'"></td>
      <td>
        <div style="font-weight:600;">${escapeHtml(en && p.name_en ? p.name_en : p.name)}</div>
        ${p.featured ? `<div style="font-size:11px;color:var(--secondary);font-weight:600;">${en ? 'Bestseller' : 'বেস্টসেলার'}</div>` : ''}
      </td>
      <td>${escapeHtml((en ? p.category_name_en : p.category_name) || p.category_name || '—')}</td>
      <td>
        <div style="font-weight:600;color:var(--primary);">${formatPrice(p.sale_price || p.price)}</div>
        ${p.sale_price ? `<div style="font-size:11px;color:var(--text-light);text-decoration:line-through;">${formatPrice(p.price)}</div>` : ''}
      </td>
      <td style="font-weight:600; color:${p.stock < 5 ? '#b91c1c' : 'var(--text)'};">${p.stock}</td>
      <td>${p.total_sold || 0}</td>
      <td><span class="status-badge ${p.active ? 'badge-active' : 'badge-inactive'}">${p.active ? (en ? 'Active' : 'সক্রিয়') : (en ? 'Inactive' : 'নিষ্ক্রিয়')}</span></td>
      <td>
        <div style="display:flex; gap:5px;">
          <button type="button" class="btn btn-outline btn-xs" onclick="editProduct(${p.id})">${svgIcon('edit', 13)}</button>
          <button type="button" class="btn btn-danger btn-xs" onclick="deleteProduct(${p.id}, ${JSON.stringify(p.name).replace(/"/g, '&quot;')})">${svgIcon('trash', 13)}</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function filterProducts() {
  const q = document.getElementById('searchProduct').value.toLowerCase();
  const filtered = allProducts.filter(p => p.name.toLowerCase().includes(q) || (p.name_en || '').toLowerCase().includes(q));
  renderProducts(filtered);
}

function openAddModal() {
  document.getElementById('modalTitle').textContent = getLang() === 'en' ? 'Add New Product' : 'নতুন পণ্য যোগ করুন';
  document.getElementById('editProductId').value = '';
  document.getElementById('productForm').reset();
  document.getElementById('existingImages').value = '[]';
  document.getElementById('existingImagesPreview').innerHTML = '';
  document.getElementById('newImagesPreview').innerHTML = '';
  document.getElementById('activeRow').style.display = 'none';
  document.getElementById('productModal').classList.add('open');
}

function renderExistingImages(imgs) {
  document.getElementById('existingImagesPreview').innerHTML = imgs.map((img, i) => `
    <div style="position:relative;">
      <img src="${escapeHtml(img)}" class="img-preview" onerror="this.src='/img/no-image.svg'">
      <button type="button" onclick="removeExistingImage(${i})" style="position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:#b91c1c;color:white;border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;">×</button>
    </div>
  `).join('');
}

function editProduct(id) {
  const p = allProducts.find(pr => pr.id === id);
  if (!p) return;

  document.getElementById('modalTitle').textContent = getLang() === 'en' ? 'Edit Product' : 'পণ্য সম্পাদনা করুন';
  document.getElementById('editProductId').value = id;
  document.getElementById('pName').value = p.name || '';
  document.getElementById('pNameEn').value = p.name_en || '';
  document.getElementById('pCategory').value = p.category_id || '';
  document.getElementById('pDescription').value = p.description || '';
  document.getElementById('pDescriptionEn').value = p.description_en || '';
  document.getElementById('pPrice').value = p.price;
  document.getElementById('pSalePrice').value = p.sale_price || '';
  document.getElementById('pStock').value = p.stock;
  document.getElementById('pSizes').value = (p.sizes || []).join(', ');
  document.getElementById('pColors').value = (p.colors || []).join(', ');
  document.getElementById('pFeatured').checked = !!p.featured;
  document.getElementById('pActive').checked = !!p.active;
  document.getElementById('activeRow').style.display = 'flex';

  const existingImgs = p.images || [];
  document.getElementById('existingImages').value = JSON.stringify(existingImgs);
  renderExistingImages(existingImgs);
  document.getElementById('newImagesPreview').innerHTML = '';
  document.getElementById('productModal').classList.add('open');
}

function removeExistingImage(index) {
  let imgs = JSON.parse(document.getElementById('existingImages').value || '[]');
  imgs.splice(index, 1);
  document.getElementById('existingImages').value = JSON.stringify(imgs);
  renderExistingImages(imgs);
}

function previewImages() {
  const files = document.getElementById('pImages').files;
  const preview = document.getElementById('newImagesPreview');
  preview.innerHTML = '';
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.createElement('img');
      img.src = e.target.result;
      img.className = 'img-preview';
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}

async function saveProduct() {
  const id = document.getElementById('editProductId').value;
  const name = document.getElementById('pName').value.trim();
  const price = document.getElementById('pPrice').value;
  if (!name || !price) {
    showToast('পণ্যের নাম ও দাম দিন', 'error');
    return;
  }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;

  const formData = new FormData();
  formData.append('name', name);
  formData.append('name_en', document.getElementById('pNameEn').value.trim());
  formData.append('description', document.getElementById('pDescription').value);
  formData.append('description_en', document.getElementById('pDescriptionEn').value);
  formData.append('price', price);
  formData.append('sale_price', document.getElementById('pSalePrice').value);
  formData.append('category_id', document.getElementById('pCategory').value);
  formData.append('stock', document.getElementById('pStock').value);

  const sizes = document.getElementById('pSizes').value.split(',').map(s => s.trim()).filter(s => s);
  const colors = document.getElementById('pColors').value.split(',').map(s => s.trim()).filter(s => s);
  sizes.forEach(s => formData.append('sizes', s));
  colors.forEach(c => formData.append('colors', c));

  formData.append('featured', document.getElementById('pFeatured').checked ? '1' : '');
  formData.append('active', document.getElementById('pActive').checked ? '1' : '0');
  formData.append('existing_images', document.getElementById('existingImages').value);

  const files = document.getElementById('pImages').files;
  Array.from(files).forEach(f => formData.append('images', f));

  const url = id ? `/admin/api/products/${id}` : '/admin/api/products';
  const method = id ? 'PUT' : 'POST';
  const data = await fetch(url, { method, body: formData }).then(r => r.json());
  btn.disabled = false;

  if (data.success) {
    showToast(data.message, 'success');
    closeProductModal();
    loadProducts();
  } else {
    showToast(data.message || 'Error', 'error');
  }
}

async function deleteProduct(id, name) {
  if (!confirm(`Delete "${name}"?`)) return;
  const data = await fetch(`/admin/api/products/${id}`, { method: 'DELETE' }).then(r => r.json());
  if (data.success) {
    showToast(data.message, 'success');
    loadProducts();
  }
}

function closeProductModal() {
  document.getElementById('productModal').classList.remove('open');
}

window.onLanguageChange = function () {
  syncLabels();
  renderProducts(allProducts);
  loadCategories();
};

syncLabels();
checkSession().then(a => {
  if (a) {
    loadCategories();
    loadProducts();
  }
});
</script>
</body>
</html>
