<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bKash Payment Gateway</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .bkash-card {
      background: white;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(209, 32, 83, 0.18);
    }
    .bkash-banner {
      background: #fffbeb;
      color: #92400e;
      font-size: 12px;
      padding: 10px 16px;
      text-align: center;
      border-bottom: 1px solid #fde68a;
    }
    .bkash-header {
      background: #d12053;
      color: white;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bkash-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
    }
    .bkash-merchant {
      background: #fdf2f8;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #fbcfe8;
    }
    .bkash-body { padding: 26px 24px; }
    .bkash-input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
      font-family: inherit;
      letter-spacing: 1px;
      outline: none;
      margin-bottom: 14px;
    }
    .bkash-input:focus { border-color: #d12053; }
    .bkash-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .btn-bkash {
      background: #d12053;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-bkash:hover { background: #b01844; }
    .btn-cancel {
      background: #f1f5f9;
      color: #475569;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .step-hint { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="bkash-card">
    <div class="bkash-banner" id="demoBanner">
      <strong>Sandbox Simulator:</strong> Configure live bKash merchant API credentials in Admin Settings to enable live payments.
    </div>
    <div class="bkash-header">
      <div class="bkash-brand">
        <span style="background:white;color:#d12053;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;">৳</span>
        <span>bKash Checkout</span>
      </div>
      <div data-lang-switcher></div>
    </div>
    <div class="bkash-merchant">
      <div>
        <div style="font-size:12px;color:#64748b;" id="lblMerchant">Merchant</div>
        <div style="font-weight:700;color:#1e293b;" id="merchantName">Lungi Ghar</div>
        <div style="font-size:12px;color:#64748b;"><span id="lblInvoice">Invoice</span>: <span id="invoiceNo">—</span></div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:12px;color:#64748b;" id="lblAmount">Total Amount</div>
        <div style="font-size:23px;font-weight:700;color:#d12053;" id="payAmount">৳0</div>
      </div>
    </div>

    <div class="bkash-body">
      <div id="step1">
        <p class="step-hint" id="hint1">আপনার বিকাশ অ্যাকাউন্ট নম্বর দিন</p>
        <input class="bkash-input" id="bkashPhone" type="tel" placeholder="017XXXXXXXX" value="01711111111">
        <div class="bkash-actions">
          <button type="button" class="btn-cancel" onclick="cancelPayment()" id="btnCancel1">বাতিল</button>
          <button type="button" class="btn-bkash" onclick="goStep2()" id="btnNext1">পরবর্তী</button>
        </div>
      </div>

      <div id="step2" style="display:none;">
        <p class="step-hint" id="hint2">ভেরিফিকেশন কোড (OTP) দিন — টেস্ট: <strong>123456</strong></p>
        <input class="bkash-input" id="bkashOtp" type="text" placeholder="123456" value="123456">
        <div class="bkash-actions">
          <button type="button" class="btn-cancel" onclick="cancelPayment()" id="btnCancel2">বাতিল</button>
          <button type="button" class="btn-bkash" onclick="goStep3()" id="btnNext2">যাচাই করুন</button>
        </div>
      </div>

      <div id="step3" style="display:none;">
        <p class="step-hint" id="hint3">আপনার বিকাশ পিন দিন — টেস্ট: <strong>12345</strong></p>
        <input class="bkash-input" id="bkashPin" type="password" placeholder="•••••" value="12345">
        <div class="bkash-actions">
          <button type="button" class="btn-cancel" onclick="cancelPayment()" id="btnCancel3">বাতিল</button>
          <button type="button" class="btn-bkash" id="confirmBtn" onclick="confirmPayment()">পেমেন্ট নিশ্চিত করুন</button>
        </div>
      </div>

      <div id="errBox" style="color:#dc2626;font-size:13px;text-align:center;margin-top:12px;"></div>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const paymentID = params.get('paymentID');

    function syncLabels() {
      const en = getLang() === 'en';
      document.getElementById('demoBanner').innerHTML = en
        ? '<strong>Sandbox Simulator:</strong> Enter live bKash Merchant API credentials in Admin Settings for production.'
        : '<strong>স্যান্ডবক্স সিমুলেটর:</strong> অ্যাডমিন সেটিংসে রিয়েল বিকাশ API কী দিলে আসল গেটওয়ে চালু হবে।';
      document.getElementById('lblMerchant').textContent = en ? 'Merchant' : 'মার্চেন্ট';
      document.getElementById('lblInvoice').textContent = en ? 'Invoice' : 'ইনভয়েস';
      document.getElementById('lblAmount').textContent = en ? 'Amount' : 'মোট পরিমাণ';
      document.getElementById('hint1').textContent = en ? 'Enter your bKash Account Number' : 'আপনার বিকাশ অ্যাকাউন্ট নম্বর দিন';
      document.getElementById('hint2').innerHTML = en ? 'Enter Verification Code (OTP) — Test: <strong>123456</strong>' : 'ভেরিফিকেশন কোড (OTP) দিন — টেস্ট: <strong>123456</strong>';
      document.getElementById('hint3').innerHTML = en ? 'Enter bKash PIN — Test: <strong>12345</strong>' : 'আপনার বিকাশ পিন দিন — টেস্ট: <strong>12345</strong>';
      ['btnCancel1', 'btnCancel2', 'btnCancel3'].forEach(id => { document.getElementById(id).textContent = en ? 'Cancel' : 'বাতিল'; });
      document.getElementById('btnNext1').textContent = en ? 'Proceed' : 'পরবর্তী';
      document.getElementById('btnNext2').textContent = en ? 'Verify' : 'যাচাই করুন';
      document.getElementById('confirmBtn').textContent = en ? 'Confirm Payment' : 'পেমেন্ট নিশ্চিত করুন';
    }

    async function loadInfo() {
      if (!paymentID) {
        document.getElementById('errBox').textContent = 'Invalid Payment Session';
        return;
      }
      const res = await fetch(`/bkash/demo-info?paymentID=${encodeURIComponent(paymentID)}`).then(r => r.json());
      if (res.success) {
        document.getElementById('merchantName').textContent = res.shop_name || 'Lungi Ghar';
        document.getElementById('invoiceNo').textContent = res.order_number;
        document.getElementById('payAmount').textContent = formatPrice(res.amount);
      } else {
        document.getElementById('errBox').textContent = res.message || 'Session not found';
      }
    }

    function goStep2() {
      const phone = document.getElementById('bkashPhone').value.trim();
      if (!/^01[3-9]\d{8}$/.test(phone)) {
        document.getElementById('errBox').textContent = getLang() === 'en' ? 'Enter a valid 11-digit number' : 'সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন';
        return;
      }
      document.getElementById('errBox').textContent = '';
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    }

    function goStep3() {
      const otp = document.getElementById('bkashOtp').value.trim();
      if (otp.length < 4) {
        document.getElementById('errBox').textContent = getLang() === 'en' ? 'Enter OTP code' : 'ভেরিফিকেশন কোড দিন';
        return;
      }
      document.getElementById('errBox').textContent = '';
      document.getElementById('step2').style.display = 'none';
      document.getElementById('step3').style.display = 'block';
    }

    function confirmPayment() {
      const pin = document.getElementById('bkashPin').value.trim();
      if (pin.length < 4) {
        document.getElementById('errBox').textContent = getLang() === 'en' ? 'Enter PIN' : 'পিন নম্বর দিন';
        return;
      }
      document.getElementById('confirmBtn').disabled = true;
      window.location.href = `/bkash/demo-callback?paymentID=${encodeURIComponent(paymentID)}&status=success`;
    }

    function cancelPayment() {
      window.location.href = `/bkash/demo-callback?paymentID=${encodeURIComponent(paymentID || '')}&status=cancel`;
    }

    window.onLanguageChange = syncLabels;
    syncLabels();
    loadInfo();
  </script>
</body>
</html>
