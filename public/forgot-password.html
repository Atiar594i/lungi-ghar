<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Lungi Ghar</title>
  <link id="siteFavicon" rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/firebase-analytics.js"></script>
  <style>
    .otp-input {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 10px;
      text-align: center;
      padding: 14px 16px;
      font-family: monospace;
    }
    .sandbox-otp-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
<div class="auth-topbar">
  <div class="container">
    <a href="/" class="logo">
      <div class="logo-mark" id="brandLogoMark"></div>
      <div class="logo-text"><span id="shopName">লুঙ্গি ঘর</span><span data-i18n="brand_sub">বাংলাদেশ হ্যান্ডলুম কালেকশন</span></div>
    </a>
    <div style="display:flex; align-items:center; gap:12px;">
      <div data-lang-switcher></div>
      <a href="/" class="btn btn-outline btn-sm" data-i18n="nav_home">হোম</a>
    </div>
  </div>
</div>

<div class="auth-page">
  <div class="auth-card">
    <!-- Step 1: Request OTP -->
    <div id="requestStepBox">
      <div style="width:52px;height:52px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:16px;" id="lockIconBox"></div>
      <h1 class="auth-title" data-i18n="forgot_password_title">পাসওয়ার্ড রিসেট করুন</h1>
      <p class="auth-sub" data-i18n="forgot_password_sub">আপনার নিবন্ধিত ইমেইল বা মোবাইল নম্বরে ৬-সংখ্যার কোড পাঠানো হবে</p>

      <div id="errBox" style="display:none; background:#fef2f2; color:#991b1b; border:1px solid #fecaca; padding:12px 14px; border-radius:8px; font-size:13.5px; margin-bottom:16px;"></div>

      <form onsubmit="handleRequestOtp(event)">
        <div class="form-group">
          <label class="form-label required" data-i18n="phone_or_email">মোবাইল নম্বর অথবা ইমেইল</label>
          <input class="form-control" id="identifier" type="text" placeholder="01XXXXXXXXX / example@gmail.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="sendCodeBtn" data-i18n="send_reset_code">রিসেট কোড পাঠান</button>
      </form>

      <p style="text-align:center; margin-top:22px; font-size:14px; color:var(--text-light);">
        <a href="/login" style="color:var(--primary); font-weight:700;" data-i18n="back_to_login">লগইনে ফিরে যান</a>
      </p>
    </div>

    <!-- Step 2: Enter OTP & New Password -->
    <div id="resetStepBox" style="display:none;">
      <div style="width:52px;height:52px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:16px;" id="shieldIconBox"></div>
      <h1 class="auth-title" data-i18n="reset_password_title">নতুন পাসওয়ার্ড সেট করুন</h1>
      <p class="auth-sub">
        <span data-i18n="reset_password_sub">ইমেইলে পাঠানো কোড ও নতুন পাসওয়ার্ড দিন</span>:
        <strong id="targetEmailDisplay" style="color:var(--dark); display:block; margin-top:4px;"></strong>
      </p>

      <div id="sandboxOtpBox" class="sandbox-otp-box"></div>
      <div id="resetErrBox" style="display:none; background:#fef2f2; color:#991b1b; border:1px solid #fecaca; padding:12px 14px; border-radius:8px; font-size:13.5px; margin-bottom:16px;"></div>

      <form onsubmit="handleResetPassword(event)">
        <div class="form-group">
          <label class="form-label required" data-i18n="otp_code_label">৬-সংখ্যার সিকিউরিটি কোড</label>
          <input class="form-control otp-input" id="otpCode" type="text" inputmode="numeric" maxlength="6" placeholder="000000" required>
        </div>

        <div class="form-group">
          <label class="form-label required" data-i18n="new_password">নতুন পাসওয়ার্ড</label>
          <input class="form-control" id="newPassword" type="password" data-i18n-placeholder="min_6_chars" placeholder="কমপক্ষে ৬ অক্ষর" required minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label required" data-i18n="confirm_password">নতুন পাসওয়ার্ড নিশ্চিত করুন</label>
          <input class="form-control" id="confirmPassword" type="password" data-i18n-placeholder="retype_password" placeholder="আবার লিখুন" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="submitResetBtn" data-i18n="reset_password_btn">পাসওয়ার্ড পরিবর্তন করুন</button>
      </form>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:18px;">
        <button type="button" class="btn btn-outline btn-sm" onclick="resendResetCode()" data-i18n="resend_otp_btn">কোড আবার পাঠান</button>
        <a href="/login" style="font-size:13px; color:var(--primary); font-weight:600;" data-i18n="back_to_login">লগইনে ফিরে যান</a>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/icons.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/cart.js"></script>
<script>
let verifiedEmail = '';
let currentIdentifier = '';

function renderBrandIcons() {
  if (typeof svgIcon !== 'function') return;
  const brandMark = document.getElementById('brandLogoMark');
  if (brandMark) brandMark.innerHTML = svgIcon('bag', 22);

  const lockBox = document.getElementById('lockIconBox');
  if (lockBox) lockBox.innerHTML = svgIcon('lock', 24);

  const shieldBox = document.getElementById('shieldIconBox');
  if (shieldBox) shieldBox.innerHTML = svgIcon('shield', 24);
}

function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const iconName = type === 'success' ? 'checkCircle' : 'alertCircle';
  toast.innerHTML = `${svgIcon(iconName, 18)} <span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

async function handleRequestOtp(e) {
  e.preventDefault();
  const identifier = document.getElementById('identifier').value.trim();
  const btn = document.getElementById('sendCodeBtn');
  const errBox = document.getElementById('errBox');
  errBox.style.display = 'none';

  if (!identifier) return;

  btn.disabled = true;
  const origText = btn.textContent;
  btn.textContent = getLang() === 'en' ? 'Sending code...' : 'কোড পাঠানো হচ্ছে...';

  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier })
    }).then(r => r.json());

    if (res.success) {
      verifiedEmail = res.email;
      currentIdentifier = identifier;

      document.getElementById('targetEmailDisplay').textContent = verifiedEmail;
      document.getElementById('requestStepBox').style.display = 'none';
      document.getElementById('resetStepBox').style.display = 'block';

      if (res.demoMode && res.demoCode) {
        const box = document.getElementById('sandboxOtpBox');
        box.style.display = 'block';
        box.innerHTML = getLang() === 'en'
          ? `<strong>Sandbox Demo Code:</strong> <span style="font-family:monospace;font-size:16px;font-weight:700;">${res.demoCode}</span> (Use this code if SMTP is not configured)`
          : `<strong>স্যান্ডবক্স ডেমো কোড:</strong> <span style="font-family:monospace;font-size:16px;font-weight:700;">${res.demoCode}</span> (SMTP কনফিগার না থাকলে এই কোড দিয়ে টেস্ট করুন)`;
      }

      showToast(getLang() === 'en' ? 'Reset code sent to your email' : (res.message || 'রিসেট কোড পাঠানো হয়েছে'), 'success');
    } else {
      errBox.textContent = res.message || (getLang() === 'en' ? 'Failed to send code' : 'কোড পাঠানো ব্যর্থ হয়েছে');
      errBox.style.display = 'block';
    }
  } catch (err) {
    errBox.textContent = getLang() === 'en' ? 'Server error. Please try again later.' : 'সার্ভারে সমস্যা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।';
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
  }
}

async function handleResetPassword(e) {
  e.preventDefault();
  const code = document.getElementById('otpCode').value.trim();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const btn = document.getElementById('submitResetBtn');
  const errBox = document.getElementById('resetErrBox');
  errBox.style.display = 'none';

  if (!code || code.length !== 6) {
    errBox.textContent = getLang() === 'en' ? 'Enter valid 6-digit code' : 'সঠিক ৬-সংখ্যার কোড দিন';
    errBox.style.display = 'block';
    return;
  }

  if (newPassword.length < 6) {
    errBox.textContent = getLang() === 'en' ? 'Password must be at least 6 characters' : 'নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে';
    errBox.style.display = 'block';
    return;
  }

  if (newPassword !== confirmPassword) {
    errBox.textContent = getLang() === 'en' ? 'Passwords do not match' : 'উভয় পাসওয়ার্ড একই হতে হবে';
    errBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  const origText = btn.textContent;
  btn.textContent = getLang() === 'en' ? 'Updating...' : 'পরিবর্তন হচ্ছে...';

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: verifiedEmail,
        code,
        new_password: newPassword
      })
    }).then(r => r.json());

    if (res.success) {
      showToast(getLang() === 'en' ? 'Password updated successfully!' : res.message, 'success');
      setTimeout(() => {
        window.location.href = '/login';
      }, 1500);
    } else {
      errBox.textContent = res.message || (getLang() === 'en' ? 'Password update failed' : 'পাসওয়ার্ড পরিবর্তন ব্যর্থ হয়েছে');
      errBox.style.display = 'block';
    }
  } catch (err) {
    errBox.textContent = getLang() === 'en' ? 'Server error. Please try again later.' : 'সার্ভারে সমস্যা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।';
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
  }
}

async function resendResetCode() {
  if (!currentIdentifier) return;
  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier: currentIdentifier })
    }).then(r => r.json());

    if (res.success) {
      if (res.demoMode && res.demoCode) {
        const box = document.getElementById('sandboxOtpBox');
        box.style.display = 'block';
        box.innerHTML = getLang() === 'en'
          ? `<strong>New Demo Code:</strong> <span style="font-family:monospace;font-size:16px;font-weight:700;">${res.demoCode}</span>`
          : `<strong>নতুন ডেমো কোড:</strong> <span style="font-family:monospace;font-size:16px;font-weight:700;">${res.demoCode}</span>`;
      }
      showToast(getLang() === 'en' ? 'New verification code sent' : res.message, 'success');
    } else {
      showToast(res.message || (getLang() === 'en' ? 'Failed to resend code' : 'কোড আবার পাঠানো সম্ভব হয়নি'), 'error');
    }
  } catch (_) {
    showToast(getLang() === 'en' ? 'Could not reach server' : 'সার্ভারে যোগাযোগ করা যায়নি', 'error');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  renderBrandIcons();
});
</script>
</body>
</html>
