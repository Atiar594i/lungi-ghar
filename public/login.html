<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Lungi Ghar</title>
  <link id="siteFavicon" rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/firebase-analytics.js"></script>
  <style>
    .otp-input {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 10px;
      text-align: center;
      padding: 14px 16px;
      font-family: monospace;
    }
    .sandbox-otp-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
<div class="auth-topbar">
  <div class="container">
    <a href="/" class="logo">
      <div class="logo-mark" id="brandLogoMark"></div>
      <div class="logo-text"><span id="shopName">লুঙ্গি ঘর</span><span data-i18n="brand_sub">বাংলাদেশ হ্যান্ডলুম কালেকশন</span></div>
    </a>
    <div style="display:flex; align-items:center; gap:12px;">
      <div data-lang-switcher></div>
      <a href="/" class="btn btn-outline btn-sm" data-i18n="nav_home">হোম</a>
    </div>
  </div>
</div>

<div class="auth-page">
  <div class="auth-card">
    <div id="loginStepBox">
      <h1 class="auth-title" data-i18n="login_title">অ্যাকাউন্টে লগইন করুন</h1>
      <p class="auth-sub" data-i18n="login_subtitle">দ্রুত চেকআউট ও অর্ডার ইতিহাস দেখতে লগইন করুন</p>

      <div id="checkoutNotice" style="display:none; background:var(--primary-soft); color:var(--primary-dark); border:1px solid #cce3d8; padding:12px 14px; border-radius:8px; font-size:13.5px; margin-bottom:16px;" data-i18n="checkout_auth_banner"></div>
      <div id="errBox" style="display:none; background:#fef2f2; color:#991b1b; border:1px solid #fecaca; padding:12px 14px; border-radius:8px; font-size:13.5px; margin-bottom:16px;"></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label required" data-i18n="phone_or_email">মোবাইল নম্বর অথবা ইমেইল</label>
          <input class="form-control" id="identifier" type="text" placeholder="01XXXXXXXXX / example@gmail.com" required>
        </div>
        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label class="form-label required" style="margin-bottom:0;" data-i18n="password">পাসওয়ার্ড</label>
            <a href="/forgot-password" style="font-size:12.5px; color:var(--primary); font-weight:600; text-decoration:none;" data-i18n="forgot_password">পাসওয়ার্ড ভুলে গেছেন?</a>
          </div>
          <input class="form-control" id="password" type="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn" data-i18n="login">লগইন</button>
      </form>

      <p style="text-align:center; margin-top:22px; font-size:14px; color:var(--text-light);">
        <span data-i18n="no_account">এখনও অ্যাকাউন্ট নেই?</span>
        <a href="/signup" id="signupLink" style="color:var(--primary); font-weight:700; margin-left:4px;" data-i18n="create_account">নতুন অ্যাকাউন্ট খুলুন</a>
      </p>
    </div>

    <!-- Unverified Account OTP Step -->
    <div id="verifyStepBox" style="display:none;">
      <div style="width:52px;height:52px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:16px;" id="otpMailIcon"></div>
      <h1 class="auth-title" data-i18n="verify_otp_title">জিমেইল কোড কনফার্ম করুন</h1>
      <p class="auth-sub">
        <span data-i18n="verify_otp_sub">আপনার জিমেইলে পাঠানো ৬-সংখ্যার ভেরিফিকেশন কোডটি নিচে বসান</span>:
        <strong id="pendingEmailDisplay" style="color:var(--dark); display:block; margin-top:4px;"></strong>
      </p>

      <div id="sandboxOtpBox" class="sandbox-otp-box"></div>
      <div id="otpErrBox" style="display:none; background:#fef2f2; color:#991b1b; border:1px solid #fecaca; padding:12px 14px; border-radius:8px; font-size:13.5px; margin-bottom:16px;"></div>

      <form onsubmit="handleVerifyOtp(event)">
        <div class="form-group">
          <label class="form-label required" data-i18n="otp_code_label">৬-সংখ্যার ভেরিফিকেশন কোড</label>
          <input class="form-control otp-input" id="otpCode" type="text" inputmode="numeric" maxlength="6" placeholder="000000" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="verifyBtn" data-i18n="verify_confirm_btn">কোড কনফার্ম করুন</button>
      </form>
      <div style="display:flex; justify-content:flex-end; margin-top:16px;">
        <button type="button" class="btn btn-outline btn-sm" onclick="resendOtp()" data-i18n="resend_otp_btn">কোড আবার পাঠান</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/icons.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/cart.js"></script>
<script>
document.getElementById('brandLogoMark').innerHTML = svgIcon('layers', 20);
document.getElementById('otpMailIcon').innerHTML = svgIcon('mail', 24);

const rawRedirect = new URLSearchParams(window.location.search).get('redirect') || '';
const safeRedirect = rawRedirect.startsWith('/') && !rawRedirect.startsWith('//') ? rawRedirect : '/account';
if (rawRedirect) {
  document.getElementById('signupLink').href = `/signup?redirect=${encodeURIComponent(safeRedirect)}`;
  if (safeRedirect === '/checkout') {
    document.getElementById('checkoutNotice').style.display = 'block';
  }
}

let pendingEmail = '';

fetch('/api/auth/me').then(r => r.json()).then(d => {
  if (d.user) window.location.href = safeRedirect;
});

fetch('/api/settings').then(r => r.json()).then(d => {
  if (d.success) {
    window._settings = d.settings;
    document.getElementById('shopName').textContent = getLang() === 'en' ? (d.settings.shop_name_en || 'Lungi Ghar') : (d.settings.shop_name || 'লুঙ্গি ঘর');
  }
});

window.onLanguageChange = function () {
  if (window._settings) {
    document.getElementById('shopName').textContent = getLang() === 'en' ? (window._settings.shop_name_en || 'Lungi Ghar') : (window._settings.shop_name || 'লুঙ্গি ঘর');
  }
};

function openOtpPrompt(email, res) {
  pendingEmail = email;
  document.getElementById('loginStepBox').style.display = 'none';
  document.getElementById('verifyStepBox').style.display = 'block';
  document.getElementById('pendingEmailDisplay').textContent = email;

  const sandboxBox = document.getElementById('sandboxOtpBox');
  if (res.demoMode && res.demoCode) {
    sandboxBox.style.display = 'block';
    sandboxBox.innerHTML = getLang() === 'en'
      ? `<strong>Sandbox Mode:</strong> Test verification code: <strong>${escapeHtml(res.demoCode)}</strong>`
      : `<strong>স্যান্ডবক্স মোড:</strong> টেস্ট কোডটি হলো: <strong>${escapeHtml(res.demoCode)}</strong>`;
  } else {
    sandboxBox.style.display = 'none';
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errBox = document.getElementById('errBox');
  errBox.style.display = 'none';
  btn.disabled = true;

  const identifier = document.getElementById('identifier').value.trim();
  const password = document.getElementById('password').value;

  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ identifier, password })
  }).then(r => r.json());

  if (res.success) {
    showToast(getLang() === 'en' ? 'Signed in successfully' : res.message, 'success');
    setTimeout(() => { window.location.href = safeRedirect; }, 450);
  } else if (res.needsVerification && res.email) {
    btn.disabled = false;
    openOtpPrompt(res.email, res);
  } else {
    errBox.textContent = res.message || 'Login failed';
    errBox.style.display = 'block';
    btn.disabled = false;
  }
}

async function handleVerifyOtp(e) {
  e.preventDefault();
  const btn = document.getElementById('verifyBtn');
  const errBox = document.getElementById('otpErrBox');
  errBox.style.display = 'none';
  btn.disabled = true;

  const code = document.getElementById('otpCode').value.trim();
  const res = await fetch('/api/auth/verify-email', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: pendingEmail, code })
  }).then(r => r.json());

  if (res.success) {
    showToast(getLang() === 'en' ? 'Email verified!' : res.message, 'success');
    setTimeout(() => { window.location.href = safeRedirect; }, 450);
  } else {
    errBox.textContent = res.message || 'Invalid code';
    errBox.style.display = 'block';
    btn.disabled = false;
  }
}

async function resendOtp() {
  const res = await fetch('/api/auth/resend-code', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: pendingEmail })
  }).then(r => r.json());
  if (res.success) {
    showToast(res.message, 'success');
    openOtpPrompt(pendingEmail, res);
  } else {
    showToast(res.message || 'Error', 'error');
  }
}
</script>
</body>
</html>
